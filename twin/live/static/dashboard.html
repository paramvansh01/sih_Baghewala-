<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baghewala Twin</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f9fafb; --text:#111827; --muted:#6b7280; --faint:#9ca3af;
  --border:#e5e7eb; --accent:#0f766e; --accent-soft:#ccfbf1;
  --ok:#15803d; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; --alarm:#b91c1c; --alarm-soft:#fee2e2;
  --info:#1d4ed8; --info-soft:#dbeafe; --practice:#94a3b8; --twin:#0f766e; --heat:#ea580c; --water:#0891b2;
  --shadow:0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1116; --surface:#161b22; --surface-2:#1c222b; --text:#e6edf3; --muted:#8b949e; --faint:#6e7681;
  --border:#2a313c; --accent:#2dd4bf; --accent-soft:#134e4a;
  --ok:#4ade80; --ok-soft:#14532d; --warn:#fbbf24; --warn-soft:#451a03; --alarm:#f87171; --alarm-soft:#450a0a;
  --info:#60a5fa; --info-soft:#172554; --practice:#64748b; --twin:#2dd4bf; --heat:#fb923c; --water:#22d3ee;
  --shadow:none;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1280px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand svg{flex:none}
nav{display:flex;gap:4px}
nav a{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:500}
nav a.on{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
nav a:hover{color:var(--text)}
.clock{margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
.clock .date{font-weight:600}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:8px;height:32px;min-width:32px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn:hover{background:var(--surface-2)}
select.iconbtn{appearance:none;padding-right:10px;color:var(--text);background:var(--surface)}
select.iconbtn option{color:var(--text);background:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.alarm{background:var(--alarm-soft);color:var(--alarm)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.sim{background:var(--warn-soft);color:var(--warn)}

/* layout */
main{max-width:1280px;margin:0 auto;padding:24px 20px 96px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:22px;letter-spacing:-.02em;margin:0 0 2px;font-weight:650}
.sub{color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow),0 0 0 1px var(--border)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.stat .label{color:var(--muted);font-size:13px}
.stat .value{font-size:28px;font-weight:650;letter-spacing:-.02em;margin:2px 0}
.stat .delta{font-size:12px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--alarm)} .flat{color:var(--muted)}
.spark{height:34px;width:100%;margin-top:6px}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)}
.item:first-child{border-top:0;padding-top:0}
.item .w{font-weight:600;min-width:74px}
.item .t{flex:1;color:var(--muted);font-size:13px}
.item .t b{color:var(--text);font-weight:600}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.events .item{padding:9px 0}
.ev-dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}

/* table */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{border:1px solid var(--border);background:var(--surface);border-radius:8px;height:34px;padding:0 12px;min-width:220px;color:var(--text);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
.tablewrap{overflow-x:auto}

/* map */
.mapwrap{position:relative}
.mapwrap svg{width:100%;display:block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.12);font-size:13px;min-width:190px;display:none;z-index:5}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dotk{width:10px;height:10px;border-radius:50%;display:inline-block}
@keyframes pulse{0%{r:6;opacity:.9}100%{r:16;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}

/* well page */
.back{color:var(--muted);font-size:13px;display:inline-block;margin-bottom:8px}
.callout{border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border:1px solid transparent}
.callout.ok{background:var(--ok-soft);border-color:transparent} .callout.warn{background:var(--warn-soft)} .callout.alarm{background:var(--alarm-soft)} .callout.info{background:var(--info-soft)}
.callout b{display:block;margin-bottom:2px}
.facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.fact .l{color:var(--muted);font-size:12px} .fact .v{font-size:18px;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:20px 0 16px}
.tabs button{border:0;background:none;padding:8px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.chart svg{width:100%;height:220px;display:block}
.chart .cap{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.chart .cap i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
svg text{fill:var(--faint);font-size:11px}
.bars .row{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.bars .row .n{width:150px;color:var(--muted)} .bars .row .b{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border)}
.bars .row .b span{display:block;height:100%;background:var(--accent)} .bars .row .p{width:48px;text-align:right}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;font-size:13px}
.kv .k{color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin-top:10px}

/* assistant */
.fab{position:fixed;right:24px;bottom:24px;z-index:30;border:0;background:var(--accent);color:#fff;border-radius:999px;height:48px;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:0 6px 20px rgba(15,118,110,.35)}
@media (prefers-color-scheme:dark){.fab{color:#042f2e}}
.drawer{position:fixed;right:0;top:0;bottom:0;width:420px;max-width:100vw;z-index:40;background:var(--surface);border-left:1px solid var(--border);box-shadow:-12px 0 32px rgba(0,0,0,.12);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
.drawer.open{transform:none}
.drawer header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer header b{flex:1}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.5}
.msg.bot{background:var(--surface-2);border:1px solid var(--border);border-top-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--accent);color:#fff;border-top-right-radius:4px;align-self:flex-end}
@media (prefers-color-scheme:dark){.msg.me{color:#042f2e}}
.msg p{margin:0 0 6px} .msg p:last-child{margin:0} .msg ul{margin:4px 0 6px;padding-left:18px}
.msg .open{display:inline-block;margin-top:6px;font-weight:600}
.suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.composer{display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid var(--border)}
.composer input{flex:1;border:1px solid var(--border);border-radius:10px;padding:0 12px;height:40px;background:var(--surface);color:var(--text);font:inherit}
.composer button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 14px;font-weight:600}
.typing{color:var(--muted);font-size:12px}

@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g2e{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.top-in{gap:10px;padding:0 12px}.brand span{display:none}nav a{padding:6px 8px}.clock .date{display:none}.g4{grid-template-columns:minmax(0,1fr)}main{padding:16px 16px 96px}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--accent)"/><path d="M13 5c3 4 5 6.6 5 9.2A5 5 0 0 1 8 14.2C8 11.6 10 9 13 5z" fill="#fff"/></svg>
    <span>Baghewala Twin</span>
  </div>
  <nav>
    <a href="#/today" data-r="today">Today</a>
    <a href="#/map" data-r="map">Field map</a>
    <a href="#/wells" data-r="wells">Wells</a>
    <a href="#/compare" data-r="compare">Compare</a>
  </nav>
  <div class="clock">
    <span class="pill sim" title="The data come from the physics twin stepping each well forward one day at a time (a simulated SCADA feed). Real Baghewala data are not public.">Simulated feed</span>
    <span class="date num" id="date">–</span>
    <button class="iconbtn" id="play" title="Pause / play"></button>
    <button class="iconbtn" id="next" title="Advance one day">Next day</button>
    <select class="iconbtn" id="speed" title="Simulation speed">
      <option value="0.25">4 days/sec</option><option value="0.5">2 days/sec</option>
      <option value="1" selected>1 day/sec</option><option value="3">1 day / 3 sec</option>
    </select>
  </div>
</div></div>

<main id="view"></main>

<button class="fab" id="fab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Ask the twin</button>
<aside class="drawer" id="drawer" aria-label="Field assistant">
  <header><svg width="22" height="22" viewBox="0 0 26 26"><rect width="26" height="26" rx="7" fill="var(--accent)"/><path d="M13 5c3 4 5 6.6 5 9.2A5 5 0 0 1 8 14.2C8 11.6 10 9 13 5z" fill="#fff"/></svg>
    <b>Field assistant</b><button class="iconbtn" id="close">Close</button></header>
  <div class="msgs" id="msgs"></div>
  <div class="suggest" id="suggest"></div>
  <form class="composer" id="ask"><input id="q" placeholder="Ask about the field or a well, e.g. “why is S12 floating?”" autocomplete="off"><button>Send</button></form>
</aside>

<script>
const $ = (s, el = document) => el.querySelector(s);
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const BBL = 0.158987294928;
const n0 = (v, d = 0) => v == null || !isFinite(v) ? "–" : Number(v).toLocaleString(undefined, {maximumFractionDigits: d, minimumFractionDigits: d});
const post = (u, b) => fetch(u, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(b)});
let S = null, fleet = localStorage.getItem("fleet") || "twin", wellsFilter = "all", wellsQuery = "", wellTab = "production";
const FLEET = {twin: "Twin control", practice: "Current practice"};
const PHASE = {production: "Pumping", injection: "Steaming", soak: "Soaking", "shut-in": "Shut in", "-": "–"};
const CARD = {normal: "Full pump (normal)", fluid_pound: "Running partly empty", gas_interference: "Gas in the pump",
  tv_leak: "Travelling valve leak", sv_leak: "Standing valve leak", pump_unseated: "Pump unseated", rod_floating: "Rods floating"};
const LEVEL_COLOR = l => cssv({ok: "--ok", warn: "--warn", alarm: "--alarm", info: "--info"}[l] || "--faint");

// ---------------- routing ----------------
function route() { const h = location.hash.replace(/^#\//, "") || "today"; const [r, id, tab] = h.split("/"); return {r, id, tab}; }
window.addEventListener("hashchange", () => { const {r, id, tab} = route(); if (tab) wellTab = tab; if (r === "well" && id) selectWell(id); render(); window.scrollTo(0, 0); });
{ const t = route().tab; if (t) wellTab = t; }
function selectWell(id) { if (!S || S.selected.well !== id || S.selected.fleet !== fleet) post("/api/select", {well: id, fleet}); }
function setFleet(f) { fleet = f; try { localStorage.setItem("fleet", f); } catch (e) {} const {r, id} = route(); if (r === "well" && id) post("/api/select", {well: id, fleet}); render(); }

// ---------------- charts ----------------
function chart(svg, o) {
  const W = svg.clientWidth || 600, H = svg.clientHeight || 220, m = {l: 48, r: o.right ? 44 : 12, t: 10, b: 24};
  const vis = o.series.filter(s => !s.right);
  const all = vis.flatMap(s => s.y.filter(v => v != null && isFinite(v)));
  let y0 = o.ymin ?? Math.min(...all, o.zero ? 0 : Infinity), y1 = o.ymax ?? Math.max(...all, o.zero ? 0 : -Infinity);
  if (!isFinite(y0) || !isFinite(y1)) { y0 = 0; y1 = 1; } if (y1 - y0 < 1e-9) y1 = y0 + 1;
  y1 += (y1 - y0) * 0.08; if (!o.zero) y0 -= (y1 - y0) * 0.04;
  const x0 = o.xmin ?? 0, x1 = o.xmax ?? 1;
  const rr = o.series.filter(s => s.right).flatMap(s => s.y.filter(v => v != null));
  const r0 = o.rmin ?? 0, r1 = o.rmax ?? Math.max(1, ...rr);
  const X = x => m.l + (x - x0) / ((x1 - x0) || 1) * (W - m.l - m.r);
  const Y = y => H - m.b - (y - y0) / (y1 - y0) * (H - m.t - m.b);
  const R = y => H - m.b - (y - r0) / ((r1 - r0) || 1) * (H - m.t - m.b);
  let g = "";
  for (let i = 0; i <= 3; i++) {
    const v = y0 + (y1 - y0) * i / 3, y = Y(v);
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="${cssv("--border")}"/>`;
    g += `<text x="${m.l - 8}" y="${y + 4}" text-anchor="end">${n0(v, Math.abs(y1 - y0) < 4 ? 1 : 0)}</text>`;
    if (o.right) g += `<text x="${W - m.r + 8}" y="${R(r0 + (r1 - r0) * i / 3) + 4}">${n0(r0 + (r1 - r0) * i / 3, 1)}</text>`;
  }
  if (o.xlabel) for (let i = 0; i <= 3; i++) { const xv = Math.round(x0 + (x1 - x0) * i / 3); g += `<text x="${X(xv)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === 3 ? "end" : "middle"}">${o.xlabel(xv)}</text>`; }
  if (o.zeroLine && y0 < 0) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="${cssv("--alarm")}" stroke-dasharray="4 4"/>`;
  if (o.band) g += `<rect x="${X(o.band[0])}" y="${m.t}" width="${Math.max(0, X(o.band[1]) - X(o.band[0]))}" height="${H - m.t - m.b}" fill="${cssv("--surface-2")}"/>`;
  if (o.now != null) g += `<line x1="${X(o.now)}" x2="${X(o.now)}" y1="${m.t}" y2="${H - m.b}" stroke="${cssv("--faint")}" stroke-dasharray="3 4"/><text x="${X(o.now) + 5}" y="${m.t + 11}">today</text>`;
  for (const s of o.series) {
    const f = s.right ? R : Y; let d = "", pen = false, prev = null; const segs = []; let seg = [];
    s.x.forEach((xv, i) => { const yv = s.y[i]; if (yv == null || !isFinite(yv)) { pen = false; if (seg.length) segs.push(seg); seg = []; return; }
      if (s.step && pen) d += `L${X(xv)},${f(prev)}`; d += (pen ? "L" : "M") + X(xv).toFixed(1) + "," + f(yv).toFixed(1); pen = true; prev = yv; seg.push([X(xv), f(yv)]); });
    if (seg.length) segs.push(seg);
    if (s.area) for (const sg of segs) if (sg.length > 1) { const b = f(Math.max(s.right ? r0 : y0, 0));
      g += `<path d="M${sg.map(p => p.join(",")).join("L")}L${sg[sg.length - 1][0]},${b}L${sg[0][0]},${b}Z" fill="${s.color}" opacity=".08"/>`; }
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""}/>`;
  }
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = g;
}
function spark(svg, ys, color) {
  const W = svg.clientWidth || 200, H = svg.clientHeight || 34, v = ys.filter(x => x != null);
  if (v.length < 2) { svg.innerHTML = ""; return; }
  const lo = Math.min(...v), hi = Math.max(...v) || 1, X = i => i / (ys.length - 1) * (W - 2) + 1, Y = y => H - 2 - (y - lo) / ((hi - lo) || 1) * (H - 4);
  const d = ys.map((y, i) => (i ? "L" : "M") + X(i) + "," + Y(y ?? lo)).join("");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = `<path d="${d}L${W - 1},${H}L1,${H}Z" fill="${color}" opacity=".1"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"/>`;
}
const cap = items => `<div class="cap">${items.map(([c, t, dash]) => `<span><i style="background:${dash ? `repeating-linear-gradient(90deg,${c} 0 5px,transparent 5px 9px)` : c}"></i>${t}</span>`).join("")}</div>`;

// ---------------- helpers ----------------
const rows = () => S.wells.map(w => ({id: w.id, ...w[fleet]}));
const attention = () => rows().filter(r => r.level === "alarm" || r.level === "warn").sort((a, b) => (a.level === "alarm" ? 0 : 1) - (b.level === "alarm" ? 0 : 1));
const pill = r => `<span class="pill ${r.level || "info"}"><i></i>${esc(r.status_label || PHASE[r.phase] || "–")}</span>`;
const fmtDate = (d, opts = {weekday: "short", day: "numeric", month: "short", year: "numeric"}) => d ? new Date(d + "T00:00:00").toLocaleDateString(undefined, opts) : "–";
function greeting() { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; }
function delta(now, prev, better = "up", unit = "") {
  if (prev == null || now == null) return `<span class="delta flat">&nbsp;</span>`;
  const d = now - prev; if (Math.abs(d) < 0.5) return `<span class="delta flat">no change from yesterday</span>`;
  const good = better === "up" ? d > 0 : d < 0;
  return `<span class="delta ${good ? "up" : "down"}">${d > 0 ? "▲" : "▼"} ${n0(Math.abs(d))}${unit} vs yesterday</span>`;
}

function drawMap(el, mini) {
  const R = rows(); if (!R.length) return;
  const xs = R.map(r => r.x), ys = R.map(r => r.y), pad = 0.8;
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  const W = 1000, H = Math.round(W * (y1 - y0) / (x1 - x0)), sx = x => (x - x0) / (x1 - x0) * W, sy = y => (y - y0) / (y1 - y0) * H;
  const unit = W / (x1 - x0), rmax = Math.max(...R.map(r => r.r_heated || 0), 1);
  const oilMax = Math.max(...R.map(r => r.oil || 0), 0.1);
  let g = `<rect width="${W}" height="${H}" rx="14" fill="var(--surface-2)"/>`;
  for (let i = Math.ceil(x0); i <= x1; i++) g += `<line x1="${sx(i)}" x2="${sx(i)}" y1="0" y2="${H}" stroke="var(--border)" stroke-width=".6"/>`;
  for (let j = Math.ceil(y0); j <= y1; j++) g += `<line x1="0" x2="${W}" y1="${sy(j)}" y2="${sy(j)}" stroke="var(--border)" stroke-width=".6"/>`;
  g += `<defs><radialGradient id="heat"><stop offset="0" stop-color="${cssv("--heat")}" stop-opacity=".85"/><stop offset=".6" stop-color="${cssv("--heat")}" stop-opacity=".35"/><stop offset="1" stop-color="${cssv("--heat")}" stop-opacity="0"/></radialGradient></defs>`;
  for (const r of R) {
    const cx = sx(r.x), cy = sy(r.y), heat = Math.max(0, Math.min(1, ((r.t_zone || 47) - 47) / 260));
    const hr = unit * (0.12 + 0.34 * (r.r_heated || 0) / rmax);
    if (heat > 0.02) g += `<circle cx="${cx}" cy="${cy}" r="${hr}" fill="url(#heat)" opacity="${(0.25 + 0.75 * heat).toFixed(2)}"/>`;
  }
  for (const r of R) {
    const cx = sx(r.x), cy = sy(r.y), col = LEVEL_COLOR(r.level), dr = 6 + 8 * Math.sqrt((r.oil || 0) / oilMax);
    if (r.level === "alarm") g += `<circle class="pulse" cx="${cx}" cy="${cy}" r="6" fill="none" stroke="${col}" stroke-width="2"/>`;
    g += `<g data-id="${r.id}" style="cursor:pointer"><circle cx="${cx}" cy="${cy}" r="${dr}" fill="${col}" stroke="var(--surface)" stroke-width="2.5"/>`;
    if (!mini) g += `<text x="${cx}" y="${cy + dr + 14}" text-anchor="middle" style="fill:var(--muted);font-size:12px">${r.id.replace("BGW-", "")}</text>`;
    g += `</g>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Schematic field map">${g}</svg><div class="tip"></div>` +
    (mini ? "" : `<div class="legend"><span><i class="dotk" style="background:var(--ok)"></i>normal</span><span><i class="dotk" style="background:var(--warn)"></i>minor issue</span><span><i class="dotk" style="background:var(--alarm)"></i>needs attention</span><span><i class="dotk" style="background:var(--info)"></i>steaming / soaking</span><span>dot size = oil rate</span><span><i class="dotk" style="background:radial-gradient(var(--heat),transparent)"></i>glow = heated zone (size = heated radius, brightness = temperature; not to scale)</span><span>Schematic layout — actual well locations are not public.</span></div>`);
  const tip = $(".tip", el);
  el.querySelectorAll("g[data-id]").forEach(n => {
    const r = R.find(x => x.id === n.dataset.id);
    n.onclick = () => location.hash = "#/well/" + r.id;
    n.onmousemove = e => {
      const b = el.getBoundingClientRect();
      tip.style.display = "block"; tip.style.left = Math.min(e.clientX - b.left + 14, b.width - 210) + "px"; tip.style.top = (e.clientY - b.top + 14) + "px";
      tip.innerHTML = `<div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:6px"><b>${r.id}</b>${pill(r)}</div>
        <div class="kv"><span class="k">Phase</span><span>${PHASE[r.phase] || r.phase}</span>
        ${r.oil != null ? `<span class="k">Oil</span><span class="num">${n0(r.oil / BBL, 1)} bbl/d</span>` : ""}
        <span class="k">Heated zone</span><span class="num">${n0(r.t_zone)} °C, ${n0(r.r_heated, 1)} m</span></div>`;
    };
    n.onmouseleave = () => tip.style.display = "none";
  });
}

      <div class="card"><h3>How these were chosen</h3>${pl ? `<p style="margin:0 0 10px">The optimiser scored hundreds of options with the cycle model, then re-ran the best few in the physics twin from this well's current state and picked the best result.</p>
      <div class="kv num"><span class="k">Predicted oil</span><span>${n0(pl.pred_oil_m3 / BBL)} bbl</span><span class="k">Verified in twin</span><span>${n0(pl.verified.oil_m3 / BBL)} bbl · SOR ${n0(pl.verified.sor, 1)}</span>
      <span class="k">Verified value</span><span>${n0(pl.verified.value_per_day)} USD/day <span class="sub">(placeholder prices)</span></span></div>`
      : `<p style="margin:0" class="sub">${fleet === "practice" ? "Current practice: settings follow the historical operating envelope." : "Using fallback settings."}</p>`}</div></div>`;
  }
}

function viewCompare() {
  const p = S.kpis.practice, t = S.kpis.twin;
  const rowsT = [["Oil produced", n0(p.cum_oil_m3 / BBL) + " bbl", n0(t.cum_oil_m3 / BBL) + " bbl", t.cum_oil_m3 >= p.cum_oil_m3],
    ["Steam per m³ oil (SOR)", n0(p.sor, 1), n0(t.sor, 1), (t.sor ?? 1e9) <= (p.sor ?? 1e9)],
    ["Pump energy per m³ oil", n0(p.kwh_per_m3) + " kWh", n0(t.kwh_per_m3) + " kWh", (t.kwh_per_m3 ?? 1e9) <= (p.kwh_per_m3 ?? 1e9)],
    ["Rod-floating well-days", n0(p.floating_days), n0(t.floating_days), t.floating_days <= p.floating_days],
    ["Rod impact strokes", n0(p.impact_strokes), n0(t.impact_strokes), t.impact_strokes <= p.impact_strokes],
    ["Net value (placeholder prices)", "$" + n0(p.net_value_usd), "$" + n0(t.net_value_usd), t.net_value_usd >= p.net_value_usd]];
  return `<div class="head"><div><h1>Twin control vs current practice</h1><div class="sub">Both fields started from the same state ${S.days_elapsed} days ago and see the same conditions. Only the decisions differ.</div></div></div>
  <div class="grid g2e">
    <div class="card chart"><h3>Cumulative oil <small>bbl</small></h3><svg id="k1"></svg>${cap([[cssv("--twin"), "twin control"], [cssv("--practice"), "current practice"]])}</div>
    <div class="card chart"><h3>Steam per m³ of oil <small>lower is better · from day ${S.sor_chart_start_day}</small></h3><svg id="k2"></svg>${cap([[cssv("--twin"), "twin control"], [cssv("--practice"), "current practice"]])}</div>
    <div class="card chart"><h3>Rod-floating well-days <small>cumulative, lower is better</small></h3><svg id="k3"></svg>${cap([[cssv("--twin"), "twin control"], [cssv("--practice"), "current practice"]])}</div>
    <div class="card"><h3>Totals so far</h3><table><thead><tr><th></th><th class="r">Current practice</th><th class="r">Twin control</th></tr></thead>
      <tbody>${rowsT.map(([l, a, b, good]) => `<tr style="cursor:default"><td>${l}</td><td class="r num">${a}</td><td class="r num" style="font-weight:600;color:${good ? "var(--ok)" : "var(--alarm)"}">${b}</td></tr>`).join("")}</tbody></table>
      <p class="note">Differences come from two things: pump speed control (slower downstrokes in thick oil, no pumping into rod damage) and steam settings chosen by the optimiser and checked in the physics twin.</p></div>
  </div>`;
}
function afterCompare() {
  const H = S.kpi_history || [], x = H.map((_, i) => i), lab = i => H[i] ? fmtDate(H[i].date, {day: "numeric", month: "short"}) : "";
  const pair = (k, f = v => v) => [{x, y: H.map(h => h.twin[k] == null ? null : f(h.twin[k])), color: cssv("--twin"), w: 2.2}, {x, y: H.map(h => h.practice[k] == null ? null : f(h.practice[k])), color: cssv("--practice"), w: 2.2}];
  const o = {xmin: 0, xmax: Math.max(1, H.length - 1), xlabel: lab};
  chart($("#k1"), {...o, zero: true, series: pair("cum_oil_m3", v => v / BBL)});
  const sd = S.sor_chart_start_day || 0;
  chart($("#k2"), {...o, zero: true, series: pair("sor").map(z => ({...z, y: z.y.map((v, i) => i < sd ? null : v)}))});
  chart($("#k3"), {...o, zero: true, series: pair("floating_days")});
}

// ---------------- render ----------------
function render() {
  if (!S) { $("#view").innerHTML = `<div class="empty">Connecting to the twin…</div>`; return; }
  $("#date").textContent = fmtDate(S.date);
  $("#play").innerHTML = S.running ? "❚❚ Pause" : "▶ Play";
  $("#next").disabled = S.running; $("#next").style.opacity = S.running ? .45 : 1;
  const {r, id} = route();
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.r === r || (r === "well" && a.dataset.r === "wells")));
  const active = document.activeElement && document.activeElement.id === "search";
  const views = {today: viewToday, map: viewMap, wells: viewWells, compare: viewCompare, well: () => viewWell(id)};
  $("#view").innerHTML = (views[r] || viewToday)();
  if (r === "today" || !views[r]) afterToday();
  if (r === "map") drawMap($("#bigmap"), false);
  if (r === "compare") afterCompare();
  if (r === "well") afterWell(id);
  const se = $("#search"); if (se) { se.oninput = e => { wellsQuery = e.target.value; render(); }; if (active) { se.focus(); se.setSelectionRange(se.value.length, se.value.length); } }
}
let pending = false;
function onSnapshot(d) { S = d; if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; if (!document.querySelector(".tip[style*='block']")) render(); }); } }

$("#play").onclick = () => post("/api/control", {running: !S.running});
$("#next").onclick = () => post("/api/control", {step: true});
$("#speed").onchange = e => post("/api/control", {seconds_per_day: +e.target.value});
window.addEventListener("resize", () => render());

// ---------------- assistant ----------------
const drawer = $("#drawer");
function md(t) {
  const blocks = esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split(/\n{2,}/);
  return blocks.map(b => { const lines = b.split("\n"); const items = lines.filter(l => l.startsWith("- "));
    if (items.length && items.length === lines.length - (lines[0].startsWith("- ") ? 0 : 1)) {
      const head = lines[0].startsWith("- ") ? "" : `<p>${lines[0]}</p>`; return head + `<ul>${items.map(l => `<li>${l.slice(2)}</li>`).join("")}</ul>`; }
    return `<p>${lines.join("<br>")}</p>`; }).join("");
}
function addMsg(who, html) { const m = document.createElement("div"); m.className = "msg " + who; m.innerHTML = html; $("#msgs").appendChild(m); $("#msgs").scrollTop = 1e9; return m; }
function setChips(list) { $("#suggest").innerHTML = list.map(c => `<button class="chip" type="button">${esc(c)}</button>`).join(""); $("#suggest").querySelectorAll("button").forEach(b => b.onclick = () => ask(b.textContent)); }
async function ask(q) {
  if (!q.trim()) return; addMsg("me", esc(q)); $("#q").value = ""; setChips([]);
  const t = addMsg("bot", `<span class="typing">Checking the live data…</span>`);
  try {
    const r = await (await post("/api/ask", {question: q, fleet})).json();
    t.innerHTML = md(r.text) + (r.well ? `<a class="open" href="#/well/${r.well}">Open ${r.well} →</a>` : "");
    setChips(r.chips || []);
  } catch (e) { t.textContent = "Sorry — I couldn't reach the twin."; }
  $("#msgs").scrollTop = 1e9;
}
$("#fab").onclick = () => { drawer.classList.add("open"); if (!$("#msgs").children.length) {
  addMsg("bot", md(`${greeting()}! I'm the field assistant. I answer from the live twin data only — ask me how the field is doing, what needs attention, or why a particular well is behaving the way it is.`));
  setChips(["How is the field today?", "What needs attention?", "Twin vs current practice?", "Explain rod floating"]); }
  setTimeout(() => $("#q").focus(), 150); };
$("#close").onclick = () => drawer.classList.remove("open");
$("#ask").onsubmit = e => { e.preventDefault(); ask($("#q").value); };
document.addEventListener("keydown", e => { if (e.key === "Escape") drawer.classList.remove("open"); });

// ---------------- data ----------------
render();
if (new URLSearchParams(location.search).has("once")) {
  fetch("/api/snapshot").then(r => r.json()).then(d => { S = d; const {r: rt, id} = route(); if (rt === "well" && id && (S.selected.well !== id)) selectWell(id); render(); openAsk(); });
} else {
  const es = new EventSource("/api/stream");
  es.onmessage = e => onSnapshot(JSON.parse(e.data));
  es.onerror = () => { $("#date").textContent = "reconnecting…"; };
  const {r, id} = route(); if (r === "well" && id) setTimeout(() => selectWell(id), 300);
  setTimeout(openAsk, 800);
}
function openAsk() {  // ?ask=... opens the assistant with that question (shareable links)
  const q = new URLSearchParams(location.search).get("ask"); if (!q) return;
  $("#fab").click(); ask(q);
}
</script>
</body>
</html>
